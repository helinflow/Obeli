plugins { id 'com.android.application' }
android {
 namespace 'io.github.helinflow.obeli'
 compileSdk 35
 defaultConfig {
  applicationId 'io.github.helinflow.obeli'
  minSdk 23
  targetSdk 35
  versionCode 2
  versionName '1.1.0'
  ndk { abiFilters 'arm64-v8a' }
  externalNativeBuild { cmake { cppFlags '-std=c++17 -O3' } }
 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 buildTypes { release { minifyEnabled false } }
}